spring:
  application:
    name: gateway-service

  main:
    web-application-type: reactive

  cloud:
    discovery:
      enabled: true
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth-service/**
              filters:
                - StripPrefix=1

            - id: diary-service
              uri: lb://diary-service
              predicates:
                - Path=/diary-service/**
              filters:
                - StripPrefix=1

            - id: currency-service
              uri: lb://currency-service
              predicates:
                - Path=/currency-service/**
              filters:
                - StripPrefix=1

            - id: country-service
              uri: lb://country-service
              predicates:
                - Path=/country-service/**
              filters:
                - StripPrefix=1

            - id: weather-service
              uri: lb://weather-service
              predicates:
                - Path=/weather-service/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

server:
  port: 8080 
